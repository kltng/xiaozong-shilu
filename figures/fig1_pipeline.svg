<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 800" width="1080" height="800" font-family="Helvetica, Arial, 'PingFang TC', 'Heiti TC', sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8742a"/></marker></defs><rect width="1080" height="800" fill="#ffffff"/>
<text x="90" y="40" font-size="15" text-anchor="start" font-weight="bold" fill="#1a1a1a" >Steps</text>
<text x="90" y="60" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5b6570" >the AI agent writes and runs each script</text>
<text x="450" y="40" font-size="15" text-anchor="start" font-weight="bold" fill="#1a1a1a" >Checks</text>
<text x="450" y="60" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5b6570" >what each result is measured against</text>
<text x="790" y="40" font-size="15" text-anchor="start" font-weight="bold" fill="#a8742a" >The historian</text>
<text x="790" y="60" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5b6570" >rules, rulings, reading the source</text>
<rect x="90" y="92" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="115" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >00 Source</text>
<text x="102" y="135" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >1966 printed edition, scanned: 4,310 pages</text>
<path d="M410,120.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="92" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="125" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >checksum of the scan file</text>
<path d="M250.0,148 V166" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="168" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="191" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >01 Page images</text>
<text x="102" y="211" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >one image per page</text>
<path d="M410,196.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="168" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="191" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >page count</text>
<text x="462" y="211" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >4,310 of 4,310</text>
<path d="M250.0,224 V242" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="244" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="267" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >02 OCR</text>
<text x="102" y="287" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >an OCR model reads every page (43 hours)</text>
<path d="M410,272.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="244" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="267" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >a second witness; loops counted</text>
<text x="462" y="287" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >median page differs 6.3%; 6 loops</text>
<path d="M790,272.0 H752" fill="none" stroke="#a8742a" stroke-width="1.3" marker-end="url(#arrA)" />
<rect x="790" y="244" width="270" height="56" rx="6" fill="#fbefd9" stroke="#a8742a" stroke-width="1.2" />
<text x="802" y="277" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >chooses the model after a 30-page test</text>
<path d="M250.0,300 V318" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="320" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="343" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >03 Pages to text</text>
<text x="102" y="363" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >margins apart; marks normalised; page order</text>
<path d="M410,348.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="320" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="343" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >record marks counted per page;</text>
<text x="462" y="363" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >printed page numbers</text>
<path d="M250.0,376 V394" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="396" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="419" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >04 Juan</text>
<text x="102" y="439" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >cut at the juan titles</text>
<path d="M410,424.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="396" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="419" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >the printed margin label on every page</text>
<text x="462" y="439" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >224 of 224 juan</text>
<path d="M250.0,452 V470" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="472" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="495" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >05 Months and records</text>
<text x="102" y="515" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >month headers; records cut at ○ and △</text>
<path d="M410,500.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="472" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="495" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >every calendar month opened once, in order</text>
<text x="462" y="515" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >221 of 221 months</text>
<path d="M790,500.0 H752" fill="none" stroke="#a8742a" stroke-width="1.3" marker-end="url(#arrA)" />
<rect x="790" y="472" width="270" height="56" rx="6" fill="#fbefd9" stroke="#a8742a" stroke-width="1.2" />
<text x="802" y="505" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >states the grammar of the chronicle</text>
<path d="M250.0,528 V546" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="548" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="571" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >06 Dates and lost dividers</text>
<text x="102" y="591" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >day names to dates; 395 dividers restored</text>
<path d="M410,576.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="548" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="571" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >new-moon day of each header; all 6,526</text>
<text x="462" y="591" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >days of the reign beside the records</text>
<path d="M790,576.0 H752" fill="none" stroke="#a8742a" stroke-width="1.3" marker-end="url(#arrA)" />
<rect x="790" y="548" width="270" height="56" rx="6" fill="#fbefd9" stroke="#a8742a" stroke-width="1.2" />
<text x="802" y="581" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >adds the rules for lost dividers</text>
<path d="M250.0,604 V622" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="624" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="647" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >07 Review page</text>
<text x="102" y="667" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >the cases no rule can decide</text>
<path d="M410,652.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="624" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="647" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >nothing preselected</text>
<text x="462" y="667" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >5 cards</text>
<path d="M790,652.0 H752" fill="none" stroke="#a8742a" stroke-width="1.3" marker-end="url(#arrA)" />
<rect x="790" y="624" width="270" height="56" rx="6" fill="#fbefd9" stroke="#a8742a" stroke-width="1.2" />
<text x="802" y="657" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >answers the cards; reads the page images</text>
<path d="M250.0,680 V698" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)" />
<rect x="90" y="700" width="320" height="56" rx="6" fill="#eaf0f6" stroke="#33526e" stroke-width="1.2" />
<text x="102" y="723" font-size="14" text-anchor="start" font-weight="bold" fill="#33526e" >08 Table</text>
<text x="102" y="743" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >13,552 records, one row each, every row dated</text>
<path d="M410,728.0 H450" fill="none" stroke="#5b6570" stroke-width="1" />
<rect x="450" y="700" width="300" height="56" rx="6" fill="#ffffff" stroke="#5b6570" stroke-width="1" stroke-dasharray="5 3"/>
<text x="462" y="723" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >row counts; new-moon day</text>
<text x="462" y="743" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a" >218 of 218 headers agree</text>
<text x="260.0" y="694" font-size="11.5" text-anchor="start" font-weight="normal" fill="#a8742a" >decisions as a file, applied by script</text>
<path d="M90,652.0 H46 V348.0 H88" fill="none" stroke="#a8742a" stroke-width="1.5" marker-end="url(#arrA)" stroke-dasharray="6 3"/>
<text x="34" y="500.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#a8742a" transform="rotate(-90 34 500.0)">when a check fails: fix the rule in its own step, then run every later step again</text>
<text x="90" y="785" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5b6570" >A step never changes the output of an earlier step. Doubtful cases are flagged, not fixed.</text>
</svg>
